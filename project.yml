name: Silt

options:
  bundleIdPrefix: app.silt
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # The whole interface is written in French, so the bundle must say so.
  # Left at the default "en", macOS resolved the app to en_FR on a French
  # Mac — French number conventions, English month names — and every date
  # printed as "August 6, 2026" under a French label.
  developmentLanguage: fr

packages:
  DiskCore:
    path: DiskCore

targets:
  Silt:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: DiskCore
        product: DiskCore
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Silt
        CFBundleDisplayName: Silt
        # Spelled out rather than left to $(DEVELOPMENT_LANGUAGE): with no
        # .lproj in the bundle, this key is the only thing that tells CFBundle
        # which language the app speaks, and every date format follows from it.
        CFBundleDevelopmentRegion: fr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: MIT licensed. Copyright © 2026 Renan Gautier.
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
        # Emptying the trash, and deletions the filesystem refuses us (apps
        # installed by another account), are delegated to the Finder over
        # Apple events.
        NSAppleEventsUsageDescription: >-
          Silt demande au Finder de vider la corbeille, et de supprimer
          les éléments qui demandent un mot de passe administrateur.
    entitlements:
      path: App/Silt.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.silt.mac
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Not sandboxed on purpose: a sandboxed app can only see folders the
        # user grants one by one, which makes "scan my whole Mac" impossible.
        # Distribution is via Developer ID + notarisation, not the App Store.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
